[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "predictmp"
version     = "1.1.0"
description = "Multi-population percentile ranking of PrediXcan-predicted gene expression (extends PredictAP)"
readme      = "README.md"
license     = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools]
# Reference data lives outside the package (PREDICTMP_DATA_DIR); never ship parquet
include-package-data = false

[tool.setuptools.packages.find]
where   = ["."]
include = ["PredictMP"]

[tool.setuptools.exclude-package-data]
PredictMP = ["data/*"]
